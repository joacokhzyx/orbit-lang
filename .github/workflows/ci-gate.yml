name: CI

on:
  push:
    branches: [ 'main', 'feat/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main', 'feat/**', 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SOVER-1 primary gate: the compiler bootstraps itself from the committed
  # canonical C using any C compiler. No toolchain beyond cc and python3.
  #
  # This job used to be twenty-four sequential steps, and in GitHub Actions a
  # failing `run:` skips every step after it -- so the step order WAS the
  # coverage policy, and a crash in runtime/test_migrations.c on Windows cost
  # fourteen gates rather than one. The order stopped mattering when the gates
  # became independent jobs: each builds what it needs and shares nothing.
  bootstrap:
    name: Bootstrap and root of trust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MSYS2_ARG_CONV_EXCL: '*'
      MSYS_NO_PATHCONV: 1
      ORBIT_CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      # fail-fast is off so one flaky leg does not hide the state of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      # Content-addressed C compile cache (scripts/orbit_ccache.py). Every entry
      # is keyed on the compiler identity, its version, the exact flags and the
      # SHA-256 of every input, so a stale entry can only ever cause a miss,
      # never a wrong artifact. Keyed on the canonical C because that is the
      # input whose change should invalidate the cached compilations of it.
      - name: Restore C compile cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-${{ runner.os }}-${{ hashFiles('compiler/selfhost/stage3.exe.c') }}
          restore-keys: |
            ccache-gcc-${{ runner.os }}-

      - name: Install SQLite development library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      # Git Bash on Windows runners is an MSYS2 host: without this, every
      # argument that looks like an absolute POSIX path is rewritten to
      # `<Git install>/...` before a native program such as python.exe sees it,
      # and the gate fails with "URL can't contain control characters".
      - name: Route argument normalization probe
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/routes_probe.py

      - name: Build and verify the self-host bootstrap (STAB-0 / STAB-1)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          set +e
          "$PY" scripts/build_selfhost.py --cc "${{ matrix.cc }}" --check-stale > gate_output.log 2>&1
          rc=$?
          set -e
          tail -n 40 gate_output.log
          exit $rc

      - name: Hermetic seed verification (STAB-1)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/verify_seed.py --cc "${{ matrix.cc }}"

  # The Python gates, by blast radius, through the one entry point. This is
  # `make all && make report`: doctor goldens, doctor scope, the CLI contract,
  # the language and std suites, the negative corpus, the frontend TIR, parity,
  # -Werror on generated C, the fuzzers, the schema and walk-coverage checks, the
  # tool aliveness check, the runtime C tests, the Kynx live gate and the gate
  # self-tests.
  #
  # It builds its own fixed point rather than consuming one from `bootstrap`. An
  # artifact would save about 34 seconds per job and cost a download, an upload,
  # and a dependency edge that can fail for reasons unrelated to the thing being
  # tested -- which is the property this split exists to remove.
  gates:
    name: Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MSYS2_ARG_CONV_EXCL: '*'
      MSYS_NO_PATHCONV: 1
      ORBIT_CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      # fail-fast is off so one flaky leg does not hide the state of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Restore C compile cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-${{ runner.os }}-${{ hashFiles('compiler/selfhost/stage3.exe.c') }}
          restore-keys: |
            ccache-gcc-${{ runner.os }}-

      - name: Install SQLite development library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      # `make all` is T0..T3 and `make report` is the report-only measurements
      # CI prints but never fails on. Both are the same entry point a developer
      # runs locally, which is the entire point: the gate sequence lived in
      # three places and they drifted.
      - name: make all and make report
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          set +e
          "$PY" scripts/dev.py all 2>&1 | tee gates.log
          rc=${PIPESTATUS[0]}
          "$PY" scripts/dev.py report 2>&1 | tee report.log
          set -e
          cat gates.log report.log
          exit $rc

  # Two checks that read two files of text and need no compiler: what
  # compiler/ast.orb declares against the code that builds nodes, and what each
  # AST walk in the compiler declares about the fields it skips. About a second
  # between them, which is why they are worth running on every push instead of
  # being discovered by hand.
  #
  # Linux only: they analyse Orbit source, so a second runner would prove that
  # Python reads the same file identically twice, at the cost of a runner.
  static:
    name: Schema and walk coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: AST schema conformance (ast.orb vs the code that builds nodes)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/schema_conformance.py

      - name: AST walk coverage (every walk declares the fields it skips)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/walk_coverage.py

      - name: Gate self-tests (the gates can say no)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/schema_conformance.py --self-test
          "$PY" scripts/walk_coverage.py --self-test
          "$PY" scripts/runtime_c_tests.py --self-test
          "$PY" scripts/kynx_live_gate.py --self-test
          "$PY" scripts/unknown_ratchet.py --self-test
          "$PY" scripts/werror_gate.py --self-test
          "$PY" scripts/alive_check.py --self-test

  # The runtime C tests and the auth harness. They compile C with a C compiler
  # and need nothing from the Orbit toolchain, which is why they are their own
  # job: when test_migrations crashed on Windows it used to abort this block and
  # take fourteen Python gates with it, and now it costs this job alone.
  runtime-c:
    name: Runtime C and auth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite development library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Runtime C tests and auth harness
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          set +e
          "$PY" scripts/runtime_c_tests.py --cc "${{ matrix.cc }}"
          rc=$?
          CC="${{ matrix.cc }}"
          LDFLAGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            LDFLAGS="-lws2_32"
            cp runtime/vendor/win-x64/sqlite3.dll . 2>/dev/null || true
          fi
          $CC -O0 -w -I runtime -I runtime/vendor -DORBIT_WITH_NET -DORBIT_WITH_DB \
            tests/auth/auth_harness.c -o t_auth_bin $LDFLAGS
          ./t_auth_bin || rc=1
          set -e
          exit $rc

  # Flakiness detector for the self-host chain. Each leg is an independent
  # fixed-point run on its own runner, so the 8 repetitions run concurrently
  # instead of serially: the flakiness being hunted is run-to-run variation, and
  # a sequential loop additionally exposed the job to the 60-minute timeout.
  # runs-on is a matrix leg rather than a loop over `seq`; fail-fast is off so
  # one flaky leg does not hide the state of the other seven.
  stress-gate:
    name: Self-host chain stress (iteration ${{ matrix.iteration }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORBIT_CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - name: Restore C compile cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-${{ runner.os }}-${{ hashFiles('compiler/selfhost/stage3.exe.c') }}
          restore-keys: |
            ccache-gcc-${{ runner.os }}-

      - name: Install SQLite development library
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Verify the fixed point on iteration ${{ matrix.iteration }}
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          echo "[stress] iteration ${{ matrix.iteration }} of 8"
          "$PY" scripts/verify_seed.py --cc gcc
          echo "[stress] iteration ${{ matrix.iteration }} passed"
