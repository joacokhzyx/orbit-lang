name: CI

on:
  push:
    branches: [ 'main', 'feat/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main', 'feat/**', 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SOVER-1 primary gate: the compiler bootstraps itself from the committed
  # canonical C using any C compiler. No Zig anywhere in this job.
  selfhost-gate:
    name: Self-host fixed-point gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify Zig-free bootstrap (STAB-0 / STAB-1)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          set +e
          "$PY" scripts/build_selfhost.py --cc "${{ matrix.cc }}" --check-stale > gate_output.log 2>&1
          rc=$?
          set -e
          tail -n 40 gate_output.log
          exit $rc

      # Probe-branch diagnostics: publish the raw gate log into the repo so it
      # is readable without authenticated API access. Remove before merge.
      - name: Publish gate log (probe diagnostics)
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if [ -f gate_output.log ]; then
            git config user.email "ci@orbit.local"
            git config user.name "orbit-ci"
            cp gate_output.log "ci-logs/gate_${{ matrix.os }}.log" 2>/dev/null || {
              mkdir -p ci-logs && cp gate_output.log "ci-logs/gate_${{ matrix.os }}.log";
            }
            git add ci-logs || true
            git commit -m "ci(logs): gate output ${{ matrix.os }} [skip ci]" || true
            git push || true
          fi

      - name: Hermetic seed verification + emit fixed-point compiler
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          SUFFIX=""; if [ "${{ runner.os }}" = "Windows" ]; then SUFFIX=".exe"; fi
          "$PY" scripts/verify_seed.py --cc "${{ matrix.cc }}" \
            --emit-fixed-point "${RUNNER_TEMP}/fixed_point${SUFFIX}"

      - name: Probe stability gate (25 goldens)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          SUFFIX=""; if [ "${{ runner.os }}" = "Windows" ]; then SUFFIX=".exe"; fi
          "$PY" scripts/parity_selfhost.py --cc "${{ matrix.cc }}" \
            --compiler "${RUNNER_TEMP}/fixed_point${SUFFIX}"

  stress-gate:
    name: Self-host chain stress (flakiness detector)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Establish canonical contract
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/build_selfhost.py --cc gcc --check-stale

      - name: Stress the self-host chain (8 consecutive fixed-point runs)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          for i in $(seq 1 8); do
            echo "[stress] iteration $i"
            "$PY" scripts/verify_seed.py --cc gcc || { echo "[stress] FAILED at iteration $i"; exit 1; }
          done
          echo "[stress] 8/8 iterations passed"
