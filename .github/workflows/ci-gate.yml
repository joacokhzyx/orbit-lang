name: CI

on:
  push:
    branches: [ 'main', 'feat/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main', 'feat/**', 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SOVER-1 primary gate: the compiler bootstraps itself from the committed
  # canonical C using any C compiler. No Zig anywhere in this job.
  selfhost-gate:
    name: Self-host fixed-point gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify Zig-free bootstrap (STAB-0 / STAB-1)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/build_selfhost.py --cc "${{ matrix.cc }}" --check-stale

      - name: Hermetic seed verification
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/verify_seed.py --cc "${{ matrix.cc }}"

  stress-gate:
    name: Self-host chain stress (flakiness detector)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Establish canonical contract
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/build_selfhost.py --cc gcc --check-stale

      - name: Stress the self-host chain (8 consecutive fixed-point runs)
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          for i in $(seq 1 8); do
            echo "[stress] iteration $i"
            "$PY" scripts/verify_seed.py --cc gcc || { echo "[stress] FAILED at iteration $i"; exit 1; }
          done
          echo "[stress] 8/8 iterations passed"

  # DEPRECATED (SOVER-1): the Zig seed lineage is kept only while its test
  # suite is ported. Non-blocking; remove once parity tests live in Orbit.
  legacy-zig-tests:
    name: Legacy Zig compiler tests (deprecated)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0-dev.1737+de207594e

      - name: Build legacy compiler
        run: zig build -Doptimize=ReleaseSafe

      - name: Run legacy test suite
        run: zig build test
