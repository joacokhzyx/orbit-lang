name: CI

on:
  push:
    branches: [ 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ 'feat/**', 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0-dev.1737+de207594e

      - name: Verify toolchain version
        shell: bash
        run: |
          expected="0.17.0-dev.1737+de207594e"
          actual="$(zig version)"
          echo "zig version: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected Zig $expected, got $actual"
            exit 1
          fi

      - name: Build compiler
        run: zig build -Doptimize=ReleaseSafe

      - name: Run test suite
        run: zig build test
