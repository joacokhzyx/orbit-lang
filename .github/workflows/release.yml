name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            bootstrap_binary: zig-out/bin/orbit.exe
            selfhost_binary: compiler/selfhost/stage1.exe
            asset: orbit-windows-x86_64.exe
          - os: ubuntu-latest
            name: linux-x86_64
            bootstrap_binary: zig-out/bin/orbit
            selfhost_binary: compiler/selfhost/stage1.exe
            asset: orbit-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0-dev.1737+de207594e

      - name: Verify toolchain version
        shell: bash
        run: |
          expected="0.17.0-dev.1737+de207594e"
          actual="$(zig version)"
          echo "zig version: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected Zig $expected, got $actual"
            exit 1
          fi

      - name: Build bootstrap compiler
        run: zig build -Doptimize=ReleaseFast

      - name: Build Self-Hosted Orbit Compiler (Stage 1 / Stage 2)
        shell: bash
        run: |
          set +e
          "${{ matrix.bootstrap_binary }}" bootstrap
          bootstrap_exit=$?
          set -e
          if [ "$bootstrap_exit" -ne 0 ]; then
            echo "[Release] Self-host bootstrap failed (exit $bootstrap_exit); the release will fall back to the bootstrap compiler."
          fi

      - name: Package Self-Hosted / Release compiler
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "${{ matrix.selfhost_binary }}" ]; then
            echo "[Release] Packaging Self-Hosted Orbit Compiler: ${{ matrix.selfhost_binary }}"
            cp "${{ matrix.selfhost_binary }}" "dist/${{ matrix.asset }}"
          else
            echo "[Release] Packaging Bootstrap Orbit Compiler: ${{ matrix.bootstrap_binary }}"
            cp "${{ matrix.bootstrap_binary }}" "dist/${{ matrix.asset }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
