name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The R6 commit the Windows release ships as bin/r6.exe (orbit-r6 is MIT,
  # https://github.com/joacokhzyx/orbit-r6). Bump it deliberately: it is the
  # native backend every Windows user runs, and it has to read the IR of this
  # tag's compiler (docs/IR_SPEC.md).
  R6_COMMIT: "a03daa5ad1bd4746e1f3e5f228ebc43d3d02a3e8"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            cc: clang
            asset: orbit-windows-x86_64.exe
          - os: ubuntu-latest
            name: linux-x86_64
            cc: gcc
            asset: orbit-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Verify self-host chain and emit the fixed-point compiler
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/build_selfhost.py --cc "${{ matrix.cc }}" --check-stale
          "$PY" scripts/verify_seed.py --release --refresh \
            --emit-fixed-point "dist/${{ matrix.asset }}"
          if [ ! -f "dist/${{ matrix.asset }}" ]; then
            echo "[Release] FAILED: the fixed-point compiler was not emitted."
            exit 1
          fi
          echo "[Release] Fixed-point compiler (self-hosted seed chain): dist/${{ matrix.asset }}"

      # The compiler links this archive instead of recompiling the runtime
      # unity when lib/ sits beside runtime/ and the stamp matches the shipped
      # sources (hello 3.4 s -> 1.3 s). Built with gcc on both platforms: the
      # archive is one plain object, so any C compiler that links gcc objects
      # can use it. A user who wants the unity build sets ORBIT_LINK_RUNTIME=0.
      - name: Build prebuilt runtime archive (lib/)
        shell: bash
        run: |
          set -euo pipefail
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/mklib_runtime.py --cc gcc --out dist/lib/libruntime_net.a
          test -s dist/lib/libruntime_net.a
          test -s dist/lib/libruntime_net.a.stamp

      # The native backend (orbit build --backend=native). R6 is built with the
      # runner's gcc by its own script, and its database archive and
      # sqlite3.lib are built from THIS checkout's runtime, so they match the compiler in
      # the same installer. libruntime_net.a is the archive built above.
      - name: Build R6 (native backend) and its runtime archives
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/joacokhzyx/orbit-r6.git r6-src
          git -C r6-src checkout $env:R6_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "R6_COMMIT $env:R6_COMMIT is not in orbit-r6" }
          $env:R6_CC = 'gcc'
          & r6-src\scripts\build-r6.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R6 did not build' }
          New-Item -ItemType Directory -Force dist\bin | Out-Null
          Copy-Item r6-src\.r6-build\r6.exe dist\bin\r6.exe
          Copy-Item r6-src\LICENSE dist\bin\LICENSE-r6.txt
          python r6-src\scripts\build-runtime-db.py --orbit-root "$PWD" --cc gcc --out-dir dist\lib
          if ($LASTEXITCODE -ne 0) { throw 'R6 database runtime archive did not build' }
          foreach ($f in 'dist\bin\r6.exe', 'dist\lib\libruntime_net.a', 'dist\lib\libruntime_net_db.a', 'dist\lib\sqlite3.lib') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          # No arguments is CLI misuse: exit 2 and a usage line, not a crash.
          & dist\bin\r6.exe 2>$null
          if ($LASTEXITCODE -ne 2) { throw "r6.exe without arguments exited $LASTEXITCODE, want 2" }
          # orbit refuses an r6 whose --version does not name the IR protocol
          # this compiler writes, so the release checks the same line.
          $r6Version = & dist\bin\r6.exe --version
          if ($r6Version -notmatch 'ir-protocol 3$') { throw "r6.exe --version printed '$r6Version', want ir-protocol 3" }
          Write-Output "[Release] R6 $env:R6_COMMIT -> dist\bin\r6.exe"

      # Native is the default backend on Windows, so the release has to build
      # and run one program. The directory mirrors installer\orbit.iss
      # (orbit.exe, bin\r6.exe, lib\, runtime\, std\) and stays out of dist\bin,
      # whose contents the wizard copies. The runner has no MinGW linker for R6,
      # so the step supplies R6_MINGW_ROOT from gcc on PATH. An installed user
      # has no such directory; that gap is separate work.
      - name: "Smoke: native build without --backend"
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist\smoke\bin | Out-Null
          Copy-Item "dist\${{ matrix.asset }}" dist\smoke\orbit.exe
          Copy-Item dist\bin\r6.exe dist\smoke\bin\r6.exe
          Copy-Item -Recurse runtime dist\smoke\runtime
          Copy-Item -Recurse std dist\smoke\std
          Copy-Item -Recurse dist\lib dist\smoke\lib
          # R6 resolves ld.exe from R6_MINGW_ROOT (default C:/w64devkit) when it
          # runs. The step above already requires gcc on PATH, so its root is
          # the one to use; on a runner with w64devkit this is that root.
          $gcc = (Get-Command gcc).Source
          $root = Split-Path (Split-Path $gcc -Parent) -Parent
          $version = & $gcc -dumpfullversion
          # R6 resolves these three paths from the two variables; a gcc that is
          # not a w64devkit root fails the link with a path nobody can read.
          $missing = @("$root\bin\ld.exe", "$root\lib\crt2.o", "$root\lib\gcc\x86_64-w64-mingw32\$version") |
            Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "R6 links with $($missing -join ', ') and it is not there; set `$env:R6_MINGW_ROOT and `$env:R6_MINGW_GCC_VERSION to a w64devkit install" }
          $env:R6_MINGW_ROOT = $root
          $env:R6_MINGW_GCC_VERSION = $version
          $env:ORBIT_CC = 'gcc'
          & dist\smoke\orbit.exe build --backend=c examples\hello.orb -o hello-c.exe
          if ($LASTEXITCODE -ne 0) { throw "the C build of examples\hello.orb exited $LASTEXITCODE" }
          $want = (& .\hello-c.exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "hello-c.exe exited $LASTEXITCODE" }
          if (-not $want) { throw 'the C build of examples\hello.orb printed nothing' }
          # --verbose prints the `r6 <cmd>` line (pipeline.orb:979) only on the
          # native path, so its absence means the default backend was not native.
          $native = @(& dist\smoke\orbit.exe build examples\hello.orb -o hello.exe --verbose)
          if ($LASTEXITCODE -ne 0) { throw "the native build of examples\hello.orb exited $LASTEXITCODE" }
          if (-not ($native -match '^r6 ')) { throw "the native build printed no 'r6 ' command line, so the default backend was not native: $native" }
          $got = (& .\hello.exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "hello.exe exited $LASTEXITCODE" }
          if (-not $got) { throw 'the native build of examples\hello.orb printed nothing' }
          if ($got -cne $want) { throw "hello.exe printed '$got'; the C build printed '$want'" }
          Remove-Item -Force hello.exe, hello-c.exe
          Write-Output "[Release] native build, no --backend, printed: $got"

      - name: Build Linux bundle (binary + std/ + runtime/ + lib/)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/bundle/orbit"
          rm -rf dist/bundle "dist/${{ matrix.asset }}.tar.gz"
          mkdir -p "$STAGE"
          cp "dist/${{ matrix.asset }}" "$STAGE/orbit"
          chmod +x "$STAGE/orbit"
          cp -r std "$STAGE/std"
          cp -r runtime "$STAGE/runtime"
          rm -f "$STAGE"/runtime/test_*.c
          cp -r dist/lib "$STAGE/lib"
          cp LICENSE "$STAGE/LICENSE.txt"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist/bundle orbit
          echo "[Release] Linux bundle: dist/${{ matrix.asset }}.tar.gz"
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | head -n 8

      - name: Check the bundle links the prebuilt archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          CHECK="$(mktemp -d)"
          tar -xzf "dist/${{ matrix.asset }}.tar.gz" -C "$CHECK"
          cp examples/hello.orb "$CHECK/hello.orb"
          cd "$CHECK"
          ./orbit/orbit build hello.orb -o hello --verbose | tee build.log
          grep -q 'libruntime_net.a' build.log
          ./hello

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.asset }}
            dist/orbit_bootstrap.c
            dist/orbit_seed*
          if-no-files-found: error

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

      # The Setup Wizard is what installs Orbit "to perfection" (PATH, .orb
      # icon + association, std/ + runtime/ beside the binary). Built only on
      # Windows, only from the verified fixed-point binary staged above.
      - name: Build Windows Setup Wizard (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Inno Setup is pinned so the wizard is reproducible.
          # Bump this version deliberately, never float it.
          choco install innosetup --version=6.3.3 -y --no-progress --allow-downgrade
          choco list --local-only innosetup
          $ver = '0.0.0-dev'
          if ('${{ github.ref }}' -like 'refs/tags/v*') { $ver = '${{ github.ref_name }}'.TrimStart('v') }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DOrbitVersion=$ver installer\orbit.iss
          if (-not (Test-Path 'dist\Orbit-Setup-*.exe')) {
            Write-Error '[Release] FAILED: the Setup Wizard was not emitted.'
            exit 1
          }

      - name: Upload Windows Setup Wizard
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Orbit-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS for all release assets
        shell: bash
        run: |
          cd release-assets
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          # release-assets/* now includes SHA256SUMS from the step above.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
