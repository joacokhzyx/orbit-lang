name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            bootstrap_binary: zig-out/bin/orbit.exe
            asset: orbit-windows-x86_64.exe
          - os: ubuntu-latest
            name: linux-x86_64
            bootstrap_binary: zig-out/bin/orbit
            asset: orbit-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0-dev.1737+de207594e

      - name: Verify toolchain version
        shell: bash
        run: |
          expected="0.17.0-dev.1737+de207594e"
          actual="$(zig version)"
          echo "zig version: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected Zig $expected, got $actual"
            exit 1
          fi

      - name: Build bootstrap compiler
        run: zig build -Doptimize=ReleaseFast

      - name: Verify seed chain and emit the fixed-point compiler
        shell: bash
        run: |
          PY="python3"; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/verify_seed.py --bootstrap --release --refresh \
            --emit-fixed-point "dist/${{ matrix.asset }}"
          if [ ! -f "dist/${{ matrix.asset }}" ]; then
            echo "[Release] FAILED: the fixed-point compiler was not emitted."
            exit 1
          fi
          echo "[Release] Fixed-point compiler (self-hosted seed chain): dist/${{ matrix.asset }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.asset }}
            dist/orbit_bootstrap.c
            dist/orbit_seed*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
