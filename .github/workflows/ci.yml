name: CI - Build & Test

on:
  push:
    branches: [ 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ 'feat/**', 'feature/**' ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0-dev.1442

      - name: Build Bootstrap Compiler
        run: zig build -Doptimize=ReleaseFast

      - name: Run Test Suite
        run: zig build test

      - name: Build Self-Hosted Orbit Compiler (Stage 1 / Stage 2)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./zig-out/bin/orbit.exe bootstrap
          else
            ./zig-out/bin/orbit bootstrap
          fi

      - name: Test Self-Hosted Compiler Binary
        shell: bash
        run: |
          if [ -f "./compiler/selfhost/stage1.exe" ]; then
            echo "[CI] Testing self-hosted compiler stage1..."
            ./compiler/selfhost/stage1.exe compiler/main.orb -o ./zig-out/bin/orbit_selfhost.exe
          fi

      - name: Lint format check
        run: zig fmt --check src/
