name: Feature request
description: Something Orbit should be able to do
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to write that Orbit cannot express today? Describe
        the situation, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A sketch of the syntax or API. Short is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: How you solve it today
      description: The workaround, and what it costs.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: >-
            I understand a language change also means: an example, a test,
            documentation, a parity golden refresh, and a fixed-point promote.
