name: Bug report
description: Something in Orbit does the wrong thing
labels: bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest .orb program, command, or script that shows it. If the
        bug is in a gate script, the exact command and its output.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Orbit version
      description: Output of `orbit --version`, or the commit SHA.
      placeholder: "0.1.0-rc.2"
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: C compiler and version
      description: Output of `cc --version` or `gcc --version`.
      placeholder: "gcc 13.3.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: expected-diagnostics
    attributes:
      label: Full output
      description: The complete compiler or gate output, not a summary.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the error in full; it is not something a gate already reports.
        - label: I checked this is not in Known Limitations.
